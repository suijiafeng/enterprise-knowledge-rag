# 本地开发：SPRING_PROFILES_ACTIVE=dev。不要在任何共享或生产环境启用。
zhiku:
  auth:
    # 允许 scripts/dev-token.mjs 签发的令牌（评测脚本等命令行工具使用）。
    dev-tokens: true
    # 本地是 http，Secure cookie 不会被浏览器发回。
    cookie-secure: false
  demo:
    # 写入演示账号 admin / operator / employee（虚构用户，见 scripts/dev-seed.sql）。
    accounts: true
    password: ${ZHIKU_DEMO_PASSWORD:zhiku-demo-2026}
